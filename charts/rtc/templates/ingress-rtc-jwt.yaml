# MatrixRTC JWT API (lk-jwt-service). Separate Ingress so StripPrefix applies only here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrixrtc-jwt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtc.labels" . | nindent 4 }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.certIssuer }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-rtc-strip-jwt@kubernetescrd
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /livekit/jwt
            pathType: Prefix
            backend:
              service:
                name: lk-jwt-service
                port:
                  number: 8080
