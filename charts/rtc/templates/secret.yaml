# LiveKit API credentials + lk-jwt-service env (must stay in sync).
# Priority: existing secret in cluster (upgrade-safe) > .Values.livekit.{key,secret} > auto-generated.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "matrixrtc-livekit" }}
{{- $key := "" }}
{{- $secret := "" }}
{{- if $existing }}
  {{- $key = index $existing.data "LIVEKIT_KEY" | b64dec }}
  {{- $secret = index $existing.data "LIVEKIT_SECRET" | b64dec }}
{{- else if and .Values.livekit.key .Values.livekit.secret }}
  {{- $key = .Values.livekit.key }}
  {{- $secret = .Values.livekit.secret }}
{{- else }}
  {{- $key = randAlphaNum 32 | sha256sum | trunc 16 }}
  {{- $secret = randAlphaNum 64 | sha256sum }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: matrixrtc-livekit
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtc.labels" . | nindent 4 }}
type: Opaque
stringData:
  keys.yaml: |
    {{ $key }}: {{ $secret | quote }}
  LIVEKIT_KEY: {{ $key }}
  LIVEKIT_SECRET: {{ $secret }}
