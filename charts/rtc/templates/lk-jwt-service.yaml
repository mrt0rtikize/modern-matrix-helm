apiVersion: apps/v1
kind: Deployment
metadata:
  name: lk-jwt-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtc.labels" . | nindent 4 }}
    app.kubernetes.io/component: lk-jwt-service
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rtc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: lk-jwt-service
  template:
    metadata:
      labels:
        {{- include "rtc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: lk-jwt-service
    spec:
      containers:
        - name: lk-jwt-service
          image: {{ .Values.jwtService.image.repository }}:{{ .Values.jwtService.image.tag }}
          imagePullPolicy: {{ .Values.jwtService.pullPolicy }}
          env:
            - name: LIVEKIT_URL
              value: {{ .Values.livekit.url }}
            - name: LIVEKIT_KEY
              valueFrom:
                secretKeyRef:
                  name: matrixrtc-livekit
                  key: LIVEKIT_KEY
            - name: LIVEKIT_SECRET
              valueFrom:
                secretKeyRef:
                  name: matrixrtc-livekit
                  key: LIVEKIT_SECRET
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: {{ .Values.livekit.fullAccessHomeservers }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.jwtService.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: lk-jwt-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtc.labels" . | nindent 4 }}
    app.kubernetes.io/component: lk-jwt-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      name: http
  selector:
    {{- include "rtc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: lk-jwt-service
