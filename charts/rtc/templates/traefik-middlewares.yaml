# Strip path prefixes so backends see requests at /. Requires Traefik KubernetesCRD provider.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rtc-strip-jwt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtc.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /livekit/jwt
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rtc-strip-sfu
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtc.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - /livekit/sfu
