# Redis for LiveKit state (required for multi-node / production SFU).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtc.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "rtc.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "rtc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}
          args:
            - redis-server
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-redis
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "rtc.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      name: redis
  selector:
    {{- include "rtc.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
