{{- if .Values.syn2mas.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mas.fullname" . }}-syn2mas-synapse-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mas.labels" . | nindent 4 }}
data:
  homeserver.yaml: |
    server_name: {{ .Values.syn2mas.synapse.serverName }}
    database:
      name: psycopg2
      args:
        user: {{ .Values.syn2mas.synapse.db.username }}
        password: {{ .Values.syn2mas.synapse.db.password | quote }}
        database: {{ .Values.syn2mas.synapse.db.database }}
        host: {{ .Values.syn2mas.synapse.db.host }}
        port: 5432
        cp_min: 5
        cp_max: 10
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "mas.fullname" . }}-syn2mas
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mas.labels" . | nindent 4 }}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: syn2mas
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - syn2mas
            - {{ .Values.syn2mas.command }}
            - --config
            - /etc/mas/config/config.yaml
            - --synapse-config
            - /etc/synapse/homeserver.yaml
          env:
            - name: MAS_CONFIG
              value: /etc/mas/config/config.yaml
          volumeMounts:
            - name: mas-config
              mountPath: /etc/mas/config
              readOnly: true
            - name: mas-secrets
              mountPath: /etc/mas/secrets
              readOnly: true
            - name: synapse-config
              mountPath: /etc/synapse
              readOnly: true
      volumes:
        - name: mas-config
          configMap:
            name: {{ include "mas.fullname" . }}-config
        - name: mas-secrets
          secret:
            secretName: {{ include "mas.fullname" . }}
        - name: synapse-config
          configMap:
            name: {{ include "mas.fullname" . }}-syn2mas-synapse-config
{{- end }}
