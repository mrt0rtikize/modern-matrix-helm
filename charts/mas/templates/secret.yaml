{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "mas.fullname" .) }}

{{- $sharedSecret := .Values.secrets.sharedSecret }}
{{- if not $sharedSecret }}
  {{- if and $existing (index $existing.data "shared-secret") }}
    {{- $sharedSecret = index $existing.data "shared-secret" | b64dec }}
  {{- else }}
    {{- $sharedSecret = randAlphaNum 64 | sha256sum }}
  {{- end }}
{{- end }}

{{- $encryptionKey := .Values.secrets.encryptionKey }}
{{- if not $encryptionKey }}
  {{- if and $existing (index $existing.data "encryption-key") }}
    {{- $encryptionKey = index $existing.data "encryption-key" | b64dec }}
  {{- else }}
    {{- $encryptionKey = randAlphaNum 64 | sha256sum }}
  {{- end }}
{{- end }}

{{- $dbPassword := .Values.postgresql.password }}
{{- if not $dbPassword }}
  {{- if and $existing (index $existing.data "mas-db-password") }}
    {{- $dbPassword = index $existing.data "mas-db-password" | b64dec }}
  {{- else }}
    {{- $dbPassword = randAlphaNum 32 }}
  {{- end }}
{{- end }}

{{- $signingKey := .Values.secrets.signingKeyPem }}
{{- if not $signingKey }}
  {{- if and $existing (index $existing.data "signing-key.pem") }}
    {{- $signingKey = index $existing.data "signing-key.pem" | b64dec }}
  {{- else }}
    {{- $signingKey = genPrivateKey "rsa" }}
  {{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mas.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mas.labels" . | nindent 4 }}
type: Opaque
stringData:
  shared-secret: {{ $sharedSecret | quote }}
  encryption-key: {{ $encryptionKey | quote }}
  mas-db-password: {{ $dbPassword | quote }}
  signing-key.pem: |
    {{ $signingKey | nindent 4 }}
